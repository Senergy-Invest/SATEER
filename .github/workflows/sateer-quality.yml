name: SATEER quality and multi-tenant audit

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: sateer-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static security and generic-context checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run static checks
        run: npm test

  database:
    name: PostgreSQL migration, audit and isolation tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sateer_test
          POSTGRES_USER: sateer
          POSTGRES_PASSWORD: sateer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sateer -d sateer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: sateer
      PGPASSWORD: sateer_test
      PGDATABASE: sateer_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations to an empty disposable database
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/*.sql; do
            echo "Applying ${migration}"
            psql -v ON_ERROR_STOP=1 -d sateer_test -f "${migration}"
          done
      - name: Run complete schema and integrity audits
        run: npm run audit:complete
      - name: Run HTTP integration test
        run: npm run test:integration
      - name: Run multi-tenant isolation test
        run: npm run test:multitenant
      - name: Run end-to-end workflow test
        run: npm run test:workflow
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sateer-multitenant-audit
          path: AUDIT/
          if-no-files-found: warn
          retention-days: 30
