<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Détail de la demande - SATEER</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <div class="app">

        <!-- ============================================ -->
        <!-- HEADER -->
        <!-- ============================================ -->

        <header class="header">

            <button
                class="back-button"
                id="backButton"
            >
                ←
            </button>


            <div class="brand">
                SATEER
            </div>


            <div class="avatar">
                F
            </div>

        </header>


        <!-- ============================================ -->
        <!-- MAIN -->
        <!-- ============================================ -->

        <main class="main">

            <!-- ======================================== -->
            <!-- HERO -->
            <!-- ======================================== -->

            <section class="consulat-hero">

                <div class="consulat-flag">
                    📄
                </div>


                <div>

                    <p
                        class="eyebrow"
                        id="detailContextLabel"
                    >
                        SATEER
                    </p>


                    <h1 id="detailTitle">
                        Chargement...
                    </h1>


                    <p class="subtitle">
                        Suivi de votre démarche
                    </p>

                </div>

            </section>


            <!-- ======================================== -->
            <!-- INFORMATIONS -->
            <!-- ======================================== -->

            <section class="panel">

                <div class="section-header">

                    <div>

                        <p class="eyebrow">
                            MA DEMANDE
                        </p>

                        <h2>
                            Informations
                        </h2>

                    </div>


                    <span
                        id="demandeStatut"
                        class="status"
                    >
                    </span>

                </div>


                <div class="demande-detail-grid">

                    <div class="detail-field">

                        <span class="detail-label">
                            Catégorie
                        </span>

                        <strong id="demandeCategorie">
                            —
                        </strong>

                    </div>


                    <div class="detail-field">

                        <span class="detail-label">
                            Priorité
                        </span>

                        <strong id="demandePriorite">
                            —
                        </strong>

                    </div>


                    <div class="detail-field">

                        <span class="detail-label">
                            Institution
                        </span>

                        <strong id="demandeOrganisation">
                            —
                        </strong>

                    </div>


                    <div class="detail-field">

                        <span class="detail-label">
                            Canal
                        </span>

                        <strong id="demandeCanal">
                            —
                        </strong>

                    </div>


                    <div class="detail-field">

                        <span class="detail-label">
                            Créée le
                        </span>

                        <strong id="demandeDateCreation">
                            —
                        </strong>

                    </div>


                    <div class="detail-field">

                        <span class="detail-label">
                            Dernière modification
                        </span>

                        <strong id="demandeDateModification">
                            —
                        </strong>

                    </div>

                </div>


                <div class="demande-message-block">

                    <span class="detail-label">
                        Votre message
                    </span>


                    <p id="demandeDescription">
                    </p>

                </div>

            </section>


            <!-- ======================================== -->
            <!-- HISTORIQUE -->
            <!-- ======================================== -->

            <section class="panel">

                <div class="section-header">

                    <div>

                        <p class="eyebrow">
                            HISTORIQUE
                        </p>

                        <h2>
                            Suivi de la demande
                        </h2>

                    </div>

                </div>


                <div
                    id="historiqueContainer"
                    class="demande-timeline"
                >
                </div>

            </section>


            <!-- ======================================== -->
            <!-- RÉPONSES -->
            <!-- ======================================== -->

            <section class="panel">

                <div class="section-header">

                    <div>

                        <p class="eyebrow">
                            ÉCHANGES
                        </p>

                        <h2>
                            Réponses de l'institution
                        </h2>

                    </div>

                </div>


                <div
                    id="reponsesContainer"
                    class="demande-reponses"
                >
                </div>

            </section>


            <!-- ======================================== -->
            <!-- ERREUR -->
            <!-- ======================================== -->

            <div
                id="detailErreur"
                class="form-message form-message-error"
                hidden
            >
            </div>

        </main>

    </div>


    <script src="demande-detail.js"></script>

  <script src="/auth-client.js"></script>
</body>

</html>
