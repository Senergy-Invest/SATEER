<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Connexion — SATEER</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f6f8; color: #17212b; }
    main { width: min(100%, 420px); background: white; border: 1px solid #e1e6eb; border-radius: 18px; padding: 32px; box-shadow: 0 12px 36px rgba(20,35,50,.08); }
    h1 { margin: 0 0 8px; font-size: 1.8rem; } p { color: #526170; line-height: 1.5; }
    label { display: block; font-weight: 600; margin: 18px 0 7px; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #cbd4dd; border-radius: 9px; font: inherit; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 9px; background: #174b73; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #loginError { padding: 10px 12px; margin-top: 14px; border-radius: 8px; background: #fff0f0; color: #9c2020; }
    .note { font-size: .9rem; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1>Connexion à SATEER</h1>
    <p>Connecte-toi avec un compte qui a été provisionné par l'administrateur du pilote.</p>
    <form id="loginForm">
      <label for="identifiant">Identifiant</label>
      <input id="identifiant" name="identifiant" autocomplete="username" maxlength="190" required>
      <label for="motDePasse">Mot de passe</label>
      <input id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" maxlength="256" required>
      <p id="loginError" role="alert" hidden></p>
      <button id="loginSubmit" type="submit">Se connecter</button>
    </form>
    <p class="note">Pas de compte public créé depuis cette page. La création et l'attribution des rôles doivent être faites par une procédure d'administration sécurisée.</p>
  </main>
  <script src="/login.js"></script>
</body>
</html>
